<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expense Tracker with Analytics</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    display: flex;
    justify-content: center;
}

.container {
    background: white;
    padding: 20px;
    width: 420px;
    margin-top: 30px;
    border-radius: 8px;
}

h1, h2 {
    text-align: center;
}

.summary {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.summary div {
    text-align: center;
}

form {
    display: flex;
    flex-direction: column;
}

form input, button {
    padding: 10px;
    margin: 5px 0;
}

button {
    background: #4CAF50;
    color: white;
    border: none;
    cursor: pointer;
}

ul {
    list-style: none;
    padding: 0;
}

li {
    background: #eee;
    padding: 8px;
    margin: 5px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.income {
    border-right: 5px solid green;
}

.expense {
    border-right: 5px solid red;
}

canvas {
    margin-top: 20px;
}
</style>
</head>

<body>
<div class="container">
    <h1>Expense Tracker</h1>

    <div class="summary">
        <div>
            <h3>Income</h3>
            <p id="income">₹0</p>
        </div>
        <div>
            <h3>Expense</h3>
            <p id="expense">₹0</p>
        </div>
        <div>
            <h3>Balance</h3>
            <p id="balance">₹0</p>
        </div>
    </div>

    <form id="transaction-form">
        <input type="text" id="text" placeholder="Description" required>
        <input type="number" id="amount" placeholder="Amount (+income, -expense)" required>
        <button>Add Transaction</button>
    </form>

    <h2>Transactions</h2>
    <ul id="transaction-list"></ul>

    <canvas id="expenseChart"></canvas>
</div>

<script>
const form = document.getElementById('transaction-form');
const list = document.getElementById('transaction-list');
const incomeEl = document.getElementById('income');
const expenseEl = document.getElementById('expense');
const balanceEl = document.getElementById('balance');

let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

function updateLocalStorage() {
    localStorage.setItem('transactions', JSON.stringify(transactions));
}

function addTransaction(e) {
    e.preventDefault();
    const text = document.getElementById('text').value;
    const amount = +document.getElementById('amount').value;

    transactions.push({ id: Date.now(), text, amount });
    updateLocalStorage();
    init();
    form.reset();
}

function removeTransaction(id) {
    transactions = transactions.filter(t => t.id !== id);
    updateLocalStorage();
    init();
}

function init() {
    list.innerHTML = '';
    let income = 0, expense = 0;

    transactions.forEach(t => {
        const li = document.createElement('li');
        li.className = t.amount > 0 ? 'income' : 'expense';
        li.innerHTML = `
            ${t.text}
            <span>₹${Math.abs(t.amount)}</span>
            <button onclick="removeTransaction(${t.id})">x</button>
        `;
        list.appendChild(li);

        t.amount > 0 ? income += t.amount : expense += t.amount;
    });

    incomeEl.innerText = `₹${income}`;
    expenseEl.innerText = `₹${Math.abs(expense)}`;
    balanceEl.innerText = `₹${income - Math.abs(expense)}`;

    drawChart(income, Math.abs(expense));
}

let chart;
function drawChart(income, expense) {
    const ctx = document.getElementById('expenseChart');
    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: ['Income', 'Expense'],
            datasets: [{
                data: [income, expense],
                backgroundColor: ['green', 'red']
            }]
        }
    });
}

form.addEventListener('submit', addTransaction);
init();
</script>
</body>
</html>
